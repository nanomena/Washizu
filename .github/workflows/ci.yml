name: CI

# Fast gate: lint and test the core on Linux, compile it on the other two
# platforms, and lint, test and build the interface. Packaging the application
# is desktop.yml's.
#
# The macOS/Windows check exists because Linux alone is not enough to prove the
# code compiles: an API can be `cfg`'d out on another platform and still build
# clean here.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# A newer push to the same ref cancels the in-flight run.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  rust:
    name: Rust (fmt + clippy + test)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      # build.rs runs prost-build on liqi.proto and needs protoc on PATH.
      - name: Setup protoc
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: rustfmt
        run: cargo fmt --all -- --check

      - name: clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: test (lib)
        run: cargo test --locked --lib

      # Compile every test target (integration tests, benches) without
      # running them: `cargo test --lib` alone misses a test that no longer
      # builds.
      - name: build all test targets
        run: cargo test --locked --no-run --all-targets

  # Compile-only on the other two platforms. No tests, no packaging — the
  # point is purely "does this platform's cfg path still build", which is the
  # one thing the Linux gate above structurally cannot tell us.
  compile:
    name: Compile (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      # build.rs runs prost-build on liqi.proto and needs protoc on PATH.
      - name: Setup protoc
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: cargo check
        run: cargo check --all-targets --locked

  frontend:
    name: Interface (lint + test + build)
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install deps
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Historical statistics repair regression
        run: node --test ../scripts/repair-history-stats.test.mjs

      # `npm run build` is `tsc -b && vite build` — type-checks too.
      - name: Build
        run: npm run build
