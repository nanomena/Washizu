[package]
name = "akagi"
version = "0.1.0"
edition = "2021"

# What this tree carries of Akagi: the version and commit of the upstream
# branch it has been followed to. This tree's own version, above, says
# nothing about that. See "Versions and upstream" in README.md.
[package.metadata.upstream]
repository = "https://github.com/shinkuan/Akagi"
branch = "v3"
version = "3.7.1"
commit = "cd68865f9e93eddcda6451cd18874a6f68c5fb49"

[lib]
name = "akagi"

[[bin]]
name = "akagi-core"
path = "src/bin/akagi-core.rs"

[build-dependencies]
prost-build = "0.14"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1.1"
# Format-preserving TOML for the config save path: `config.toml` can hold keys
# this build doesn't declare (another Akagi's, or the user's own), and
# serialising over the file would delete them. See `src/config/merge.rs`.
toml_edit = "0.25"
clap = { version = "4.6", features = ["derive"] }
anyhow = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "signal", "fs", "process", "io-util", "io-std", "time", "net"] }
async-trait = "0.1.89"
which = "8.0.2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "chrono"] }
tracing-appender = "0.2"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
serde_with = "3.18.0"
prost = "0.14"
prost-reflect = { version = "0.16", features = ["serde"] }
base64 = "0.22"
flate2 = "1"
riichienv-core = "0.4.8"
native_bot = { path = "native_bot" }
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json", "stream", "http2", "charset", "socks"] }
tempfile = "3"
futures-util = "0.3"
dirs = "6"
chromiumoxide = "0.9.1"
ulid = { version = "1", features = ["serde"] }
rand = "0.9"
http = "1"
form_urlencoded = "1.2.2"
# Tenhou `<UN/>` roster names are bare percent-encoded UTF-8 (no `+`-as-space
# form semantics, so `form_urlencoded` would be wrong for them).
percent-encoding = "2.3"
rand_distr = "0.5"
mlua = { version = "0.12.0", features = ["lua54", "vendored", "send", "error-send"] }

[dev-dependencies]
tempfile = "3"
